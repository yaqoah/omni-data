name: CI/CD Pipeline - Fintech Merchant Platform

on:
  push:
    branches:
      - main
      - ci-test
      - develop
  pull_request:
    branches:
      - main
      - ci-test
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # STAGE 1: LINT & UNIT TESTS
  # ============================================================================
  
  test-backend:
    name: Backend Tests (Django)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fintech_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6543:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Run database migrations
        env:
          DB_NAME: fintech_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 6543
          DB_SSLMODE: disable
          DEBUG: 'False'
        run: |
          cd backend
          python manage.py migrate
      
      - name: Seed test data
        env:
          DB_NAME: fintech_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 6543
          DB_SSLMODE: disable
          DEBUG: 'False'
        run: |
          cd backend
          python manage.py seed_merchants
      
      - name: Run pytest with coverage
        env:
          DB_NAME: fintech_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 6543
          DEBUG: 'False'
        run: |
          cd backend
          pytest tests/ -v --cov=merchants --cov=analytics \
            --cov-report=term-missing --cov-report=xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: unittests
          name: codecov-umbrella
  
  # ============================================================================
  # STAGE 2: SECURITY & LINTING
  # ============================================================================
  
  security-checks:
    name: Security Scans
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install bandit safety
      
      - name: Run Bandit security scan
        run: |
          cd backend
          bandit -r . -f json -o bandit-report.json || true
      
      - name: Check for known vulnerabilities
        run: |
          cd backend
          pip install safety
          pip install -r requirements.txt
          safety check -r requirements.txt || true
  
  # ============================================================================
  # STAGE 3: DOCKER BUILD
  # ============================================================================
  
  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: [test-backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./Dockerfile.backend
          push: false
          tags: fintech-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./Dockerfile.frontend
          push: false
          tags: fintech-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          